name: Build, Publish, and Deploy CelestialUI-Vue

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write

env:
  NODE_VERSION: 20
  # Set these in your GitHub repo secrets
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
  DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  build-lib:
    name: Build Library
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          registry-url: https://registry.npmjs.org/
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm run type-check:lib
      - name: Build library
        run: pnpm run build-lib
      - name: Test (optional)
        run: pnpm run test:unit
      - name: Upload library artifacts
        uses: actions/upload-artifact@v4
        with:
          name: library-build
          path: dist/
          retention-days: 7

  publish-npm:
    name: Publish to NPM
    needs: build-lib
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org/
          cache: 'pnpm'
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build library
        run: pnpm run build-lib
      - name: Publish package
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          pnpm publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  demo-gh-pages:
    name: Build and Deploy Demo to GH Pages
    needs: build-lib
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build demo
        run: pnpm run build-demo
        env:
          BASE_URL: /CelestialUI-Vue/   # GitHub Pages subfolder
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload demo to Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  demo-vercel:
    name: Deploy Demo to Vercel (optional)
    needs: build-lib
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build demo
        run: pnpm run build-demo
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ env.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.ORG_ID }}
          vercel-project-id: ${{ secrets.PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./

  storybook-build-and-deploy:
    name: Build and Deploy Storybook
    needs: build-lib
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Storybook
        run: pnpm run build-storybook
        env:
          # Set SB_BASE_URL to /CelestialUI-Vue/storybook/ for GitHub Pages
          SB_BASE_URL: /CelestialUI-Vue/storybook/
      - name: Deploy Storybook to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./storybook-static
          publish_branch: gh-pages
          destination_dir: storybook # host at /storybook subpath
          force_orphan: true
          commit_message: "Deploy Storybook from CelestialUI-Vue - ${{ github.sha }}"

  # Alternative: Deploy Storybook to main GitHub Pages repo
  storybook-external-repo:
    name: Deploy Storybook to External Repo (Alternative)
    needs: build-lib
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && env.DEPLOY_KEY != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Storybook
        run: pnpm run build-storybook
        env:
          SB_BASE_URL: /CelestialUI-Vue/storybook/
      - name: Deploy Storybook to External GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ env.DEPLOY_KEY }}
          external_repository: dev-1603/dev-1603.github.io
          publish_branch: main
          publish_dir: ./storybook-static
          destination_dir: storybook # host at /storybook subpath
          force_orphan: true
          commit_message: "Deploy Storybook from CelestialUI-Vue - ${{ github.sha }}"

# Notes for configuration:
# - For Vercel, set up $VERCEL_TOKEN and configure project base if needed.
# - BASE_URL and SB_BASE_URL are set in Vite/Storybook config to match deployed subpaths.
# - Your docs and storybook will be accessible under:
#   https://dev-1603.github.io/CelestialUI-Vue/ (demo)
#   https://dev-1603.github.io/CelestialUI-Vue/storybook/ (storybook)
# - The workflow automatically handles both internal GitHub Pages and external repo deployment
